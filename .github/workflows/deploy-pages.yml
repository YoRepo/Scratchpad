name: Check, build web, deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "game/**"
      - "tools/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    name: Lint, test, export
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          TDIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          unzip -q -j templates.tpz \
            'templates/version.txt' \
            'templates/web_nothreads_release.zip' \
            'templates/web_nothreads_debug.zip' \
            -d "$TDIR"
          ./godot --version

      - name: Lint GDScript
        run: |
          pip install --quiet "gdtoolkit==4.*"
          gdlint game/src game/tests

      - name: Stamp the build version with the commit
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i -E "s|^config/version=\"([^\"+]*)(\+[^\"]*)?\"|config/version=\"\1+${SHORT_SHA}\"|" game/project.godot
          grep '^config/version=' game/project.godot

      - name: Import project resources
        run: ./godot --headless --path game --import

      - name: Headless engine test
        run: ./godot --headless --path game tests/headless_smoke.tscn

      - name: Export web build
        run: |
          mkdir -p build/web
          ./godot --headless --path game --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          ls -la build/web

      # GitHub Pages caches index.pck and friends for ten minutes and phones hold on to them
      # longer, so every file the engine fetches carries this commit as a query string.
      - name: Bust browser caches with the commit hash
        run: tools/bust_cache.sh build/web/index.html "${GITHUB_SHA::7}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser smoke test
        run: |
          cd tools && npm install --no-audit --no-fund && npx playwright install --with-deps chromium && cd ..
          node tools/web_smoke_test.js build/web build/smoke

      - name: Keep smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: build/smoke
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
